<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>エージェント可視化の試作</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&family=DotGothic16&display=swap" rel="stylesheet" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #4f9e3f;
        --card: #101018;
        --card-2: #1d1d2e;
        --ink: #ffffff;
        --muted: #c9c9d6;
        --line: #ffffff;
        --accent: #6ee7a0;
        --accent-soft: #173d2a;
        --coral: #ff8a70;
        --amber: #ffd75e;
        --amber-soft: #4a3a12;
        --blue: #7fd4ff;
        --blue-soft: #17384d;
        --gray-soft: #2a2a3d;
        --wall: #8b8fa3;
        --wall-line: #565a6e;
        --floor: #c9975a;
        --floor-line: #9c6f36;
        --rug: #b8303c;
        --rug-line: #ffd75e;
        --desk: #6e4520;
        --desk-top: #a06a32;
        --shadow: 6px 6px 0 rgba(0,0,0,.38);
        --ok: #4ade80;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        font-family: "DotGothic16", "M PLUS Rounded 1c", system-ui, sans-serif;
        /* ドラクエ風・草原タイルの背景（Gatherのマップ外側） */
        background-color: #57a639;
        background-image:
          linear-gradient(45deg, rgba(255,255,255,.06) 25%, transparent 25%, transparent 75%, rgba(255,255,255,.06) 75%),
          linear-gradient(45deg, rgba(0,0,0,.07) 25%, transparent 25%, transparent 75%, rgba(0,0,0,.07) 75%),
          linear-gradient(#62b445, #4f9e3f);
        background-size: 32px 32px, 32px 32px, 100% 100%;
        background-position: 0 0, 16px 16px, 0 0;
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
      }
      .app { max-width: 1380px; margin: 0 auto; padding: 14px 14px 28px; }
      .layout{grid-template-columns:minmax(0,1fr) 330px!important}
      @media(max-width:880px){.layout{grid-template-columns:1fr!important}}

      /* ---------- toolbar ---------- */
      /* ===== ドラクエ風コマンドウィンドウ（黒窓＋白フチ＋二重枠） ===== */
      .toolbar, .card {
        background: #101018 !important; color: #fff !important;
        border: 3px solid #fff !important; border-radius: 8px !important;
        box-shadow: 0 0 0 3px #101018, 6px 6px 0 rgba(0,0,0,.38) !important;
      }
      .toolbar {
        display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
        padding: 12px 14px; margin-bottom: 18px;
      }
      .stats { display: flex; flex-wrap: wrap; gap: 8px; margin-right: auto; }
      .stat {
        display: inline-flex; align-items: center; gap: 6px;
        background: #1d1d2e; border: 2px solid #55556e;
        border-radius: 4px; padding: 5px 10px; font-size: 13px; font-weight: 700; color:#fff;
      }
      .stat b { font-size: 15px; color: var(--amber); }
      .dot { width: 10px; height: 10px; border-radius: 2px; flex: none; box-shadow: inset -2px -2px 0 rgba(0,0,0,.3); }
      .dot.work { background: var(--ok); }
      .dot.wait { background: var(--amber); }
      .dot.done { background: var(--blue); }
      .dot.idle { background: #a49c88; }
      .btn {
        font: inherit; font-size: 13px; font-weight: 700; cursor: pointer;
        border: 2px solid #fff; background: #101018; color: #fff;
        border-radius: 4px; padding: 7px 13px;
      }
      .btn::before { content: "▶ "; color: var(--amber); opacity: 0; }
      .btn:hover { background: #2b2b48; } .btn:hover::before { opacity: 1; }
      .btn:active { transform: translate(2px,2px); }

      /* ---------- layout ---------- */
      .layout { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 14px; align-items: start; }
      @media (max-width: 880px) { .layout { grid-template-columns: 1fr; } }

      /* ---------- room : Gather風マップ × ドラクエ風タイル ---------- */
      .room-wrap { background: #5b3a1e; border: 4px solid #2b1a0c; border-radius: 6px; box-shadow: 6px 6px 0 rgba(0,0,0,.38); padding: 8px; }
      .room {
        position: relative; width: 100%; aspect-ratio: 16 / 12.5; overflow: hidden;
        border: 4px solid #1a1208; border-radius: 2px; cursor: pointer; touch-action: manipulation;
        image-rendering: pixelated;
        background:
          repeating-linear-gradient(90deg, transparent 0 30px, rgba(90,52,18,.55) 30px 32px),
          repeating-linear-gradient(0deg, transparent 0 30px, rgba(90,52,18,.45) 30px 32px),
          repeating-linear-gradient(90deg, #d2a263 0 32px, #c9975a 32px 64px);
        background-color: #c9975a;
      }
      @media (max-width: 560px) { .room { aspect-ratio: 4 / 5.2; } }
      /* expanded zones */
      .zone-bath{position:absolute;right:0;top:17%;width:22%;height:22%;background:repeating-linear-gradient(90deg,#bfe8f2 0 18px,#9fd4e6 18px 20px),repeating-linear-gradient(0deg,transparent 0 18px,rgba(70,140,160,.35) 18px 20px),#cdeef7;border-left:4px solid #5aa0b5;border-bottom:4px solid #5aa0b5;z-index:1}
      .zone-gym{position:absolute;right:1%;bottom:2%;width:24%;height:24%;background:#3a6b4f;border:3px solid #23402f;border-radius:4px;z-index:1;background-image:repeating-linear-gradient(90deg,transparent 0 22px,rgba(255,255,255,.12) 22px 24px)}
      .zone-kitchen{position:absolute;left:0;bottom:0;width:27%;height:26%;background:repeating-linear-gradient(0deg,#e8d5a8 0 20px,#d9c08a 20px 22px);border-top:4px solid #8a6a3a;border-right:4px solid #8a6a3a;z-index:1}
      .zone-living{position:absolute;left:30%;bottom:1%;width:36%;height:24%;background:#7a2e35;border:3px solid #ffd75e;z-index:1}
      .bathtub{position:absolute;right:4%;top:22%;width:16%;height:11%;background:#fff;border:4px solid #7fb8c9;border-radius:0 0 18px 18px;z-index:2;box-shadow:inset 0 6px 0 #aee6f5}
      .bathtub::before{content:"";position:absolute;left:8%;top:-45%;width:22%;height:50%;background:#ffd9ec;border:2px solid #c97aa6;border-radius:50%}
      .bathtub::after{content:"♨";position:absolute;right:6%;top:-70%;font-size:14px;color:#5aa0b5}
      .dining-table{position:absolute;left:5%;bottom:8%;width:18%;height:10%;background:#8a5a2b;border:3px solid #4a2d10;z-index:2;border-radius:3px}
      .dining-table::before{content:"🍚 🍳 🥗";position:absolute;inset:2px;font-size:11px;text-align:center;letter-spacing:2px}
      .gym-mat{position:absolute;right:6%;bottom:12%;width:14%;height:6%;background:#ff8a70;border:2px solid #b84a32;z-index:2}
      .dumbbell{position:absolute;font-size:14px;z-index:3;filter:drop-shadow(1px 1px 0 #000)}
      .tv{position:absolute;left:38%;bottom:23.5%;width:20%;height:9%;background:#101828;border:3px solid #000;z-index:2;display:grid;place-items:center;color:#7fd4ff;font-size:10px;letter-spacing:.08em}
      .tv::after{content:"";position:absolute;bottom:-8px;left:42%;width:16%;height:6px;background:#000}
      .prop{position:absolute;right:-6px;top:34px;width:22px;height:22px;background:#101018;border:2px solid #fff;border-radius:4px;display:none;place-items:center;font-size:13px;z-index:5;box-shadow:2px 2px 0 rgba(0,0,0,.4)}
      .agent.has-prop .prop{display:grid}
      .agent.action-workout .avatar{animation:squat .5s steps(2,end) infinite!important}
      @keyframes squat{0%,100%{transform:translateY(0) scaleY(1)}50%{transform:translateY(3px) scaleY(.92)}}
      .agent.action-bath .avatar{opacity:.92;filter:drop-shadow(0 0 6px #aee6f5)}
      .agent.action-phone .avatar{animation:bob .9s steps(2,end) infinite}
      .agent.action-eat .prop{animation:eatBounce .6s steps(2,end) infinite}
      @keyframes eatBounce{50%{transform:translateY(-3px)}}
      /* ===== リアルみ強化：キーボードと両手タッピング（PC作業） ===== */
      .fx{display:none;position:absolute;z-index:6;pointer-events:none}
      .fx-keyboard{left:50%;bottom:-3px;transform:translateX(-50%);width:46px;height:15px;background-color:#20242e;border:2px solid #0c0f16;border-radius:3px;box-shadow:2px 2px 0 rgba(0,0,0,.35);background-image:repeating-linear-gradient(90deg,#454e63 0 4px,transparent 4px 7px),repeating-linear-gradient(0deg,transparent 0 4px,rgba(255,255,255,.10) 4px 5px)}
      .fx-keyboard .hand{position:absolute;top:-6px;width:10px;height:10px;background:#ffdfc2;border:2px solid #d9a06b;border-radius:3px;box-shadow:1px 1px 0 rgba(0,0,0,.3)}
      .fx-keyboard .hL{left:6px;animation:tapHand .18s steps(2,end) infinite}
      .fx-keyboard .hR{right:6px;animation:tapHand .18s steps(2,end) infinite;animation-delay:-.09s}
      @keyframes tapHand{0%,100%{transform:translateY(0)}50%{transform:translateY(3px)}}
      .agent.action-pc .fx-keyboard{display:block}
      .agent.action-pc .prop{display:none}
      .agent.action-pc .avatar{animation:bob .36s steps(2,end) infinite}
      /* スマホは体の前で両手持ち風に */
      .agent.action-phone .prop{right:auto;left:50%;top:auto;bottom:4px;transform:translateX(-50%)}
      /* ===== リアルみ強化：お風呂（肩まで浸かる＋湯面じゃばじゃば＋湯気） ===== */
      .fx-bath{left:-6px;right:-6px;top:0;bottom:-4px}
      .agent.action-bath .fx-bath{display:block}
      .agent.action-bath .avatar svg{transform:translateY(5px)}
      .fx-bath .water{position:absolute;left:0;right:0;bottom:0;height:48%;background:repeating-linear-gradient(90deg,#8fd8ef 0 7px,#6ec7e8 7px 9px,#a5e4f7 9px 16px);border-top:3px solid #eafcff;opacity:.94;animation:jabajaba .5s steps(3,end) infinite}
      .fx-bath .water::before{content:"";position:absolute;left:6%;right:6%;top:-7px;height:5px;background:repeating-linear-gradient(90deg,#eafcff 0 6px,transparent 6px 11px);animation:jabajaba .5s steps(3,end) infinite reverse}
      @keyframes jabajaba{0%{background-position:0 0}100%{background-position:11px 0}}
      .fx-bath .steam{position:absolute;top:-4px;width:8px;height:8px;background:#fff;border-radius:2px;opacity:0;box-shadow:1px 1px 0 rgba(120,180,200,.5);animation:steamRise 2.2s steps(6,end) infinite}
      .fx-bath .s1{left:16%}
      .fx-bath .s2{left:46%;width:10px;height:10px;animation-delay:-.8s}
      .fx-bath .s3{left:74%;animation-delay:-1.5s}
      @keyframes steamRise{0%{transform:translate(0,2px) scale(.7);opacity:0}30%{opacity:.95}100%{transform:translate(3px,-20px) scale(1.25);opacity:0}}
      /* マップの質感：湯船ゾーンの水のきらめき、TVのちらつき、部屋の奥行き */
      .zone-bath{animation:bathShimmer 2.8s steps(6,end) infinite}
      @keyframes bathShimmer{0%{background-position:0 0,0 0,0 0}100%{background-position:36px 0,0 0,0 0}}
      .tv{animation:tvFlicker 2.6s steps(14,end) infinite}
      @keyframes tvFlicker{0%,100%{filter:brightness(1)}48%{filter:brightness(1)}50%{filter:brightness(1.35)}52%{filter:brightness(.92)}54%{filter:brightness(1.1)}}
      .room{box-shadow:inset 0 0 0 4px rgba(0,0,0,.14),inset 0 -20px 26px rgba(60,30,0,.16),inset 0 10px 18px rgba(60,30,0,.10)}
      .torch-f svg{transform-origin:50% 30%;animation:flameFlicker .34s steps(2,end) infinite}
      @keyframes flameFlicker{0%,100%{transform:scaleY(1) translateX(0)}50%{transform:scaleY(1.14) translateX(.5px)}}
      /* Gather風ゾーン：中央の通路（石畳） */
      .path { position:absolute; left:46%; top:17%; width:8%; height:83%; background: repeating-linear-gradient(0deg,#b9bdc9 0 22px,#9fa4b3 22px 24px), #b9bdc9; border-left:3px solid #7d8293; border-right:3px solid #7d8293; opacity:.95; }
      .path-h { position:absolute; left:0; top:52%; width:100%; height:10%; background: repeating-linear-gradient(90deg,#b9bdc9 0 22px,#9fa4b3 22px 24px), #b9bdc9; border-top:3px solid #7d8293; border-bottom:3px solid #7d8293; opacity:.55; }
      .wall {
        position: absolute; left: 0; right: 0; top: 0; height: 17%; z-index:2;
        /* 城・酒場の石壁レンガ */
        background:
          repeating-linear-gradient(0deg, transparent 0 14px, #4c4f61 14px 16px),
          repeating-linear-gradient(90deg, transparent 0 30px, #4c4f61 30px 32px),
          linear-gradient(#9aa0b5,#7e8499);
        border-bottom: 6px solid #3f4254;
        box-shadow: 0 6px 0 rgba(0,0,0,.22);
      }
      .wall::before { content:""; position:absolute; left:0; right:0; top:0; height:8px; background: repeating-linear-gradient(90deg,#565a6e 0 24px, transparent 24px 40px); }
      .window {
        position: absolute; top: 18%; width: 13%; height: 60%;
        background: linear-gradient(180deg, #8ed8ff, #dff6ff);
        border: 4px solid #5b3a1e; border-radius: 2px; box-shadow: inset 0 0 0 2px #fff8c9;
      }
      .window::after { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 4px; background: #5b3a1e; }
      .window::before { content: ""; position: absolute; top: 50%; left:0; right:0; height:4px; background:#5b3a1e; z-index:1; }
      .board {
        position: absolute; top: 8%; left: 42%; width: 28%; height: 80%;
        /* 木の掲示板＝クエストボード */
        background: repeating-linear-gradient(0deg,#8a5a2b 0 12px,#7a4e24 12px 14px), #8a5a2b;
        border: 4px solid #4a2d10; border-radius: 2px; padding: 5px 7px;
        font-size: clamp(7px, 1.4vw, 11px); color: #fff7d6; line-height: 1.5; overflow: hidden;
        text-shadow: 1px 1px 0 #000;
      }
      .board b { display: block; font-size: 1.15em; color: #ffd75e; }
      .clock { display:none; }
      .torch { position:absolute; top:22%; width:22px; height:34px; z-index:3; image-rendering:pixelated; }
      .rug {
        position: absolute; left: 35%; top: 58%; width: 30%; height: 28%; z-index:1;
        /* 王宮の赤絨毯（Gatherの集まる広場） */
        background: repeating-linear-gradient(90deg,#c03442 0 16px,#a92835 16px 32px);
        border: 4px solid #ffd75e; outline: 3px solid #7d1520; border-radius: 2px;
      }
      .desk {
        position: absolute; width: 17%; height: 9.5%; z-index:2;
        background: repeating-linear-gradient(90deg,#a06a32 0 18px,#8f5c28 18px 20px), #a06a32;
        border: 3px solid #4a2d10; border-radius: 2px;
        box-shadow: 0 5px 0 rgba(0,0,0,.28);
      }
      .desk::before {
        content: ""; position: absolute; left: 50%; top: -38%; width: 36%; height: 66%;
        transform: translateX(-50%); background: #202838; border: 3px solid #0c0f16; border-radius: 2px;
        box-shadow: inset 0 0 0 2px #6ee7a0;
      }
      .desk::after {
        content: ""; position: absolute; right: 8%; top: 18%; width: 10%; height: 44%;
        background: #e33e4e; border:2px solid #7d1520; border-radius: 1px;
      }
      .plant { position: absolute; z-index:2; line-height: 1; user-select: none; }
      .plant svg, .deco svg { display:block; width:100%; height:auto; image-rendering:pixelated; }
      .deco { position:absolute; z-index:2; user-select:none; pointer-events:none; }
      .sofa {
        position: absolute; width: 15%; height: 8%; z-index:2;
        background: #b8303c; border: 3px solid #6e1420; border-radius: 2px; box-shadow:0 4px 0 rgba(0,0,0,.25);
      }
      .sofa::before { content: ""; position: absolute; inset: 18% 8% auto; height: 40%; background: #d94a58; border:2px solid #6e1420; }
      .shelf {
        position: absolute; width: 12%; height: 7%; z-index:2;
        background: #6e4520; border: 3px solid #3d240e; border-radius: 2px;
        background-image: repeating-linear-gradient(90deg, #d95f4b 0 10px, #e9b949 10px 20px, #4b8fbf 20px 30px, #67a35c 30px 40px);
        background-size: 100% 55%; background-repeat: no-repeat; background-position: bottom;
      }
      .entrance { position:absolute; left:44%; bottom:0; width:12%; height:7%; z-index:2; background:#3a2410; border:3px solid #ffd75e; border-bottom:0; color:#ffd75e; font-size:10px; display:grid; place-items:center; letter-spacing:.1em; }
      .zone-label { position:absolute; z-index:2; background:#101018; color:#fff; border:2px solid #fff; border-radius:3px; font-size:10px; padding:2px 6px; pointer-events:none; }
      .room-hint { font-size: 12px; color: #fff7d6; margin: 9px 4px 2px; font-weight: 700; text-shadow:1px 1px 0 rgba(0,0,0,.35); line-height:1.6; }

      /* ---------- agents (pixel-art sprites) ---------- */
      .agent {
        position: absolute; width: 58px; margin-left: -29px; margin-top: -86px;
        cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent;
        transition: none; z-index: 5;
      }
      .agent.main { width: 76px; margin-left: -38px; margin-top: -108px; z-index: 8; }
      .card h2, .card h3, .detail-name, .nameplate, .board, .btn {
        font-family: "DotGothic16", "M PLUS Rounded 1c", sans-serif; letter-spacing: .02em;
      }
      .agent .bubble {
        position: absolute; left: 50%; bottom: calc(100% + 6px); transform: translateX(-50%);
        width: max-content; max-width: 168px;
        background: #101018; color: #fff; border: 2px solid #fff; border-radius: 4px;
        outline: 2px solid #101018;
        padding: 5px 9px; font-size: 11px; font-weight: 700; line-height: 1.45;
        box-shadow: 3px 3px 0 rgba(0,0,0,.35); text-align: center;
        pointer-events: none;
      }
      .agent .bubble::after {
        content: "▼"; position: absolute; left: 50%; bottom: -13px; transform: translateX(-50%);
        font-size: 9px; color: #fff; text-shadow: 1px 1px 0 #000;
      }
      body.no-bubbles .agent .bubble { display: none; }
      .agent .avatar { position: relative; animation: bob 1.6s steps(2, end) infinite; filter: drop-shadow(0 4px 3px rgba(60,40,10,.28)); }
      .agent.main .avatar { animation-duration: 2s; }
      .agent .avatar .flip { position: relative; }
      .agent .avatar svg { display: block; width: 100%; height: auto; image-rendering: pixelated; }
      .agent .avatar svg.fB { position: absolute; left: 0; top: 0; opacity: 0; }
      @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
      /* toko-toko walk: body hops and sways side to side while legs and arms swing in 2 steps */
      .agent.walking .avatar { animation: tokotoko .26s steps(2, end) infinite; }
      @keyframes tokotoko { 0%, 100% { transform: translateY(0) rotate(-1.7deg); } 50% { transform: translateY(-3px) rotate(1.7deg); } }
      .agent.walking .avatar svg.fA { animation: legA .26s steps(1, end) infinite; }
      .agent.walking .avatar svg.fB { animation: legB .26s steps(1, end) infinite; }
      @keyframes legA { 0%, 49.9% { opacity: 1; } 50%, 100% { opacity: 0; } }
      @keyframes legB { 0%, 49.9% { opacity: 0; } 50%, 100% { opacity: 1; } }
      .agent.selected .avatar { outline: 3px solid var(--coral); outline-offset: 2px; border-radius: 6px; }
      .nameplate {
        margin-top: 2px; display: flex; align-items: center; justify-content: center; gap: 4px;
        width: max-content; position: relative; left: 50%; transform: translateX(-50%);
        font-size: 11px; font-weight: 800; color: #fff;
        background: #101018; border: 2px solid #fff; border-radius: 3px; padding: 1px 7px;
        white-space: nowrap; box-shadow: 2px 2px 0 rgba(0,0,0,.35);
      }
      .agent.main .nameplate { font-size: 12.5px; background: #101018; border-color: #ffd75e; color:#ffd75e; }
      .badge-main {
        background: #d9a83c; color: #101018; font-size: 9.5px; font-weight: 800;
        border-radius: 2px; padding: 1px 6px; letter-spacing: .04em;
      }
      .badge-sub {
        background: #3d7ea6; color: #fff; font-size: 9.5px; font-weight: 800;
        border-radius: 2px; padding: 1px 6px;
      }

      /* ---------- side panel ---------- */
      .panel { display: flex; flex-direction: column; gap: 18px; }
      .card { padding: 16px; }
      .card h2 { margin: 0 0 4px; font-size: 16px; font-weight: 800; color:#fff; }
      .card h3 { margin: 0 0 10px; font-size: 14px; font-weight: 800; color: var(--amber); }
      .card h3::before { content: "◆ "; color:#fff; }
      .detail-head { display: flex; gap: 12px; align-items: center; }
      .detail-head .face { width: 50px; height: 58px; flex: none; background:#e8dcc0; border:2px solid #fff; border-radius:3px; padding:2px; }
      .detail-head .face svg { width: 100%; height: 100%; image-rendering: pixelated; }
      .detail-name { font-size: 19px; font-weight: 800; display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
      .detail-role { font-size: 12.5px; color: var(--muted); font-weight: 700; margin-top: 2px; }
      .detail-name { color:#fff; }
      .chip {
        display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 800;
        border-radius: 999px; padding: 3px 10px; margin-top: 7px;
      }
      .chip.work { background: var(--accent-soft); color: var(--accent); }
      .chip.wait { background: var(--amber-soft); color: var(--amber); }
      .chip.done { background: var(--blue-soft); color: var(--blue); }
      .chip.idle { background: var(--gray-soft); color: var(--muted); }
      .real-note {

        var a = findAgent(selectedId); if (a) sendTo(a, x, y);
      });

      /* ============ detail panel ============ */
      var detailCard = document.getElementById("detailCard");
      var stateIcon = { done: "✓", work: "●", wait: "!", queued: "…" };
      function renderDetail() {
        var a = findAgent(selectedId); if (!a) return;
        var c = statusClass(a);
        var chipLabel = a.main ? a.statusLabel : (c === "work" ? "作業中" : c === "done" ? "全タスク完了" : "待機中");
        var html = "";
        html += '<div class="detail-head"><div class="face">' + faceSVG(a.color, a.accessory, null, "idle", "", a.outfit) + "</div><div>" +
          '<div class="detail-name">' + a.name +
          (a.main ? '<span class="badge-main">メイン</span>' : '<span class="badge-sub">サブ</span>') + "</div>" +
          '<div class="detail-role">' + a.role + "</div>" +
          '<span class="chip ' + c + '"><span class="dot ' + c + '"></span>' + chipLabel + "</span>" +
          "</div></div>";
        var curG = state[a.id] && state[a.id].gimmick;
        html += '<div style="margin-top:10px;font-size:12.5px;background:#1d1d2e;border:2px solid #55556e;border-radius:4px;padding:8px 10px">いまの様子： <b>' + (curG ? curG.prop + " " + curG.bubble : (state[a.id] && state[a.id].mode==="walk" ? "トコトコ移動中…" : "デスク／持ち場で活動中")) + '</b><br><span style="color:var(--muted)">日常アクション： PC作業・スマホ操作・食事・お風呂・筋トレ・ソファ休憩・読書・ゲームなどをランダムに行います</span></div>';
        if (a.main) {
          html += '<div class="real-note">おちゃ本人の仕事リストです（2026年11月10日時点の実際の状況）。サブエージェントの表示と区別するため、金色の「メイン」バッジが付いています。</div>';
        } else {
          html += '<div class="demo-note">このサブエージェントの仕事は、試作用のサンプル表示です。実際に動かすときは、ここに本物のタスクが流れます。</div>';
        }
        html += '<ul class="tasklist">';
        a.tasks.forEach(function (t) {
          html += '<li class="task"><div class="task-top">' +
            '<span class="task-ic ' + t.state + '">' + stateIcon[t.state] + "</span>" +
            '<div><div class="task-title">' + t.title + '</div><div class="task-note">' + t.note + "</div></div>" +
            '<span class="task-state ' + t.state + '">' + t.label + "</span></div>" +
            (t.state === "work" || t.state === "wait" ? '<div class="bar"><i style="width:' + t.progress + '%"></i></div>' : "") +
            "</li>";
        });
        html += "</ul>";
        detailCard.innerHTML = html;
      }

      /* ============ member list & stats ============ */
      var memberList = document.getElementById("memberList");
      function renderMembers() {
        memberList.innerHTML = "";
        agents.forEach(function (a) {
          var b = document.createElement("button");
          b.type = "button";
          b.className = "member-row" + (a.id === selectedId ? " sel" : "");
          b.innerHTML = '<span class="face">' + faceSVG(a.color, a.accessory, null, "idle", "", a.outfit) + "</span>" +
            '<span><span class="mname">' + a.name +
            (a.main ? '<span class="badge-main">メイン</span>' : '<span class="badge-sub">サブ</span>') + "</span>" +
            '<span class="mtask">' + currentTaskTitle(a) + "</span></span>" +
            '<span class="dot ' + statusClass(a) + '"></span>';
          b.addEventListener("click", function () { selectAgent(a.id); });
          memberList.appendChild(b);
        });
        var work = 0, wait = 0, doneTasks = 0, totalTasks = 0;
        agents.forEach(function (a) {
          var c = statusClass(a);
          if (c === "work") work++; if (c === "wait") wait++;
          a.tasks.forEach(function (t) { totalTasks++; if (t.state === "done") doneTasks++; });
        });
        document.getElementById("stats").innerHTML =
          '<span class="stat"><span class="dot work"></span>作業中 <b>' + work + "</b></span>" +
          '<span class="stat"><span class="dot wait"></span>返信・確認待ち <b>' + wait + "</b></span>" +
          '<span class="stat"><span class="dot done"></span>完了タスク <b>' + doneTasks + " / " + totalTasks + "</b></span>" +
          '<span class="stat">メンバー <b>' + agents.length + "</b>人</span>";
        syncDots();
      }
      function selectAgent(id) {
        selectedId = id;
        agents.forEach(function (a) { state[a.id].el.classList.toggle("selected", a.id === id); });
        renderDetail(); renderMembers();
      }

      /* ============ activity log ============ */
      var logList = document.getElementById("logList");
      var logEntries = [];
      function nowTime() {
        var d = new Date();
        return ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2);
      }
      function addLog(text, real) {
        logEntries.unshift({ t: nowTime(), text: text, real: !!real });
        if (logEntries.length > 7) logEntries.pop();
        logList.innerHTML = logEntries.map(function (e) {
          return "<li><time>" + e.t + '</time><span class="tag ' + (e.real ? "real" : "demo") + '">' +
            (e.real ? "実際" : "サンプル") + "</span><span>" + e.text + "</span></li>";
        }).join("");
      }
      addLog("おちゃ：丸八製菓様の帰りの新幹線候補（直通・乗り換え案）を提示しました", true);
      addLog("おちゃ：大溝さんへのリスト共有状況の確認が完了しました", true);
      addLog("おちゃ：明日の朝会に向けた準備をはじめました", true);
      addLog("さくら：調査タスクを受け取りました", false);

      /* ============ simulation (sub-agents only) ============ */
      setInterval(function () {
        if (paused) return;
        agents.forEach(function (a) {
          if (a.main) return; // おちゃの実タスクは勝手に進めない
          var t = a.tasks.filter(function (x) { return x.state === "work"; })[0];
          if (!t) return;
          t.progress += 2 + Math.floor(Math.random() * 5);
          if (t.progress >= 100) {
            t.progress = 100; t.state = "done"; t.label = "完了";
            addLog(a.name + "：「" + t.title + "」が完了しました", false);
            var next = a.tasks.filter(function (x) { return x.state === "queued"; })[0];
            if (next) { next.state = "work"; next.label = "進行中"; next.progress = 5; }
            else {
              var nt = taskPool[Math.floor(Math.random() * taskPool.length)].replace(/中$/, "");
              a.tasks.push({ title: nt, note: "試作用のサンプルタスクです", state: "work", label: "進行中", progress: 3 });
              if (a.tasks.length > 5) a.tasks.splice(2, 1);
            }
            refreshBubbles();
          }
        });
        renderDetail(); renderMembers();
      }, 1400);

      /* ============ controls ============ */
      var btnPause = document.getElementById("btnPause");
      btnPause.addEventListener("click", function () {
        paused = !paused;
        btnPause.textContent = paused ? "▶ 再開する" : "⏸ 一時停止";
      });
      document.getElementById("btnBubble").addEventListener("click", function () {
        document.body.classList.toggle("no-bubbles");
        this.textContent = document.body.classList.contains("no-bubbles") ? "吹き出し：OFF" : "吹き出し：ON";
      });
      document.getElementById("btnGather").addEventListener("click", function () {
        gathered = !gathered;
        this.textContent = gathered ? "仕事に戻す" : "みんなを広場に集める";
        agents.forEach(function (a, i) {
          if (gathered) {
            var ang = (i / agents.length) * Math.PI * 2;
            sendTo(a, 50 + Math.cos(ang) * 11, 71 + Math.sin(ang) * 9);
          } else {
            sendTo(a, a.home.x, a.home.y);
          }
        });
        if (gathered) addLog("みんなが広場に集まりました", false);
      });
      var addCount = 0;
      document.getElementById("btnAdd").addEventListener("click", function () {
        var def = subPool[(4 + addCount) % subPool.length];
        addCount++;
        var freeDesk = desks[agents.length % desks.length];
        var a = makeSub(def, 0);
        a.x = 50; a.y = 95; a.home = { x: freeDesk.x, y: freeDesk.y };
        agents.push(a);
        var el = agentEl(a);
        state[a.id] = { el: el, bubbleEl: el.querySelector(".bubble"), dotEl: el.querySelector(".sdot"),
          flipEl: el.querySelector(".flip"), propEl: el.querySelector(".prop"),
          tx: a.x, ty: a.y, mode: "stay", waitUntil: 0, bubbleIdx: 0, gimmick: null, actionUntil: 0, pendingGimmick: null,
          path: [], pathIdx: 0, goalX: a.x, goalY: a.y, yieldSince: 0, yieldSide: 0, clearSince: 0, replanAt: 0, stuckX: a.x, stuckY: a.y, stuckAt: performance.now(), sepAt: 0,
          strollAt: performance.now() + 8000 };
        place(a);
        sendTo(a, a.home.x, a.home.y);
        addLog(a.name + "（" + def.role + "）がお部屋に加わりました", false);
        selectAgent(a.id);
        refreshBubbles();
      });

      selectAgent("ocha");
      /* demo: start a few daily-life actions so the gimmicks are visible right away */
      setTimeout(function(){ if(agents[1]){ state[agents[1].id].pendingGimmick=GIMMICKS[4]; sendTo(agents[1], GIMMICKS[4].x, GIMMICKS[4].y, GIMMICKS[4]); } }, 800);
      setTimeout(function(){ if(agents[2]){ state[agents[2].id].pendingGimmick=GIMMICKS[3]; sendTo(agents[2], GIMMICKS[3].x, GIMMICKS[3].y, GIMMICKS[3]); } }, 1600);
      setTimeout(function(){ if(agents[3]){ state[agents[3].id].pendingGimmick=GIMMICKS[2]; sendTo(agents[3], GIMMICKS[2].x, GIMMICKS[2].y, GIMMICKS[2]); } }, 2400);
      setTimeout(function(){ if(agents[4]){ state[agents[4].id].pendingGimmick=GIMMICKS[0]; sendTo(agents[4], GIMMICKS[0].x, GIMMICKS[0].y, GIMMICKS[0]); } }, 3200);
    </script>
  </body>
</html>
